<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Timing Calculator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {}
            }
        };
    </script>
    <style>
        body {
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 100%);
            color: #fff;
            font-family: 'Arial', sans-serif;
        }
        .gradient-accent {
            background: linear-gradient(135deg, #00d4ff 0%, #0099ff 100%);
        }
        .gradient-success {
            background: linear-gradient(135deg, #00ff88 0%, #00cc66 100%);
        }
        .gradient-danger {
            background: linear-gradient(135deg, #ff3333 0%, #cc0000 100%);
        }
        .gradient-warning {
            background: linear-gradient(135deg, #ffaa00 0%, #ff6600 100%);
        }
        .gradient-epic {
            background: linear-gradient(135deg, #ff00ff 0%, #00ffff 100%);
        }
        .sport-card {
            background: rgba(20, 30, 60, 0.8);
            border: 2px solid #00d4ff;
            backdrop-filter: blur(10px);
        }
        .sport-input {
            background: rgba(15, 25, 50, 0.9);
            border: 2px solid #00d4ff;
            color: #fff;
            transition: all 0.3s;
        }
        .sport-input:focus {
            border-color: #00ff88;
            box-shadow: 0 0 15px rgba(0, 255, 136, 0.5);
            outline: none;
        }
        .sport-btn {
            position: relative;
            overflow: hidden;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s;
        }
        .sport-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(0, 212, 255, 0.4);
        }
        .pulse-animation {
            animation: pulse-glow 2s infinite;
        }
        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 10px rgba(0, 212, 255, 0.5); }
            50% { box-shadow: 0 0 25px rgba(0, 212, 255, 0.8); }
        }
        .header-title {
            background: linear-gradient(135deg, #00ff88 0%, #00d4ff 50%, #ff00ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 900;
            letter-spacing: 2px;
        }
        .scoreboard {
            background: rgba(10, 20, 50, 0.9);
            border: 3px solid #00ff88;
            border-radius: 10px;
            padding: 15px;
            margin: 10px 0;
        }
        .stat-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #00d4ff;
            font-weight: bold;
        }
        .stat-value {
            font-size: 28px;
            font-weight: 900;
            color: #00ff88;
        }
        table tbody tr:hover {
            background: rgba(0, 212, 255, 0.1);
        }
        .finish-line {
            background: linear-gradient(90deg, #ff00ff 0%, transparent 50%, #ff00ff 100%);
            height: 3px;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <div class="min-h-screen p-6">
        <!-- Header -->
        <div class="mb-8 pb-6 relative">
            <div class="flex items-center justify-between mb-6">
                <div>
                    <h1 class="header-title text-5xl font-black mb-2">🏆 COMPETITION TIMER</h1>
                    <p class="text-cyan-300 text-lg font-bold tracking-wider">⚡ REAL-TIME SCHEDULE GENERATOR ⚡</p>
                </div>
                <div class="text-right">
                    <p class="text-cyan-400 text-sm uppercase font-bold tracking-widest">Last Sync</p>
                    <p id="lastSaved" class="text-2xl font-black text-lime-400 pulse-animation">--:--</p>
                </div>
            </div>
            <div class="finish-line"></div>
        </div>

        <!-- Main Container -->
        <div class="grid grid-cols-1 lg:grid-cols-5 gap-8">
            <!-- Left Panel: Input Form -->
            <div class="lg:col-span-2">
                <div class="sport-card rounded-xl p-8 sticky top-6">
                    <h2 class="text-3xl font-black mb-6 text-transparent bg-clip-text bg-gradient-to-r from-cyan-300 to-lime-400">⚙️ NEW EVENT</h2>

                    <!-- Event Input Form -->
                    <div class="space-y-4">
                        <div>
                            <label class="block text-xs font-black uppercase tracking-widest text-cyan-300 mb-2">🏃 Event Name</label>
                            <input
                                type="text"
                                id="eventName"
                                placeholder="e.g., 100m Sprint"
                                class="sport-input w-full px-4 py-3 rounded-lg text-white placeholder-cyan-500"
                            />
                        </div>

                        <div>
                            <label class="block text-xs font-black uppercase tracking-widest text-cyan-300 mb-2">⏰ Start Time</label>
                            <input
                                type="time"
                                id="startTime"
                                class="sport-input w-full px-4 py-3 rounded-lg text-white"
                                value="09:00"
                            />
                        </div>

                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-xs font-black uppercase tracking-widest text-cyan-300 mb-2">👥 Athletes</label>
                                <input
                                    type="number"
                                    id="competitorCount"
                                    min="1"
                                    placeholder="24"
                                    class="sport-input w-full px-4 py-3 rounded-lg text-white placeholder-cyan-500"
                                    value="1"
                                />
                            </div>
                            <div>
                                <label class="block text-xs font-black uppercase tracking-widest text-cyan-300 mb-2">⏱️ Time/Athlete</label>
                                <input
                                    type="number"
                                    id="avgTimeSec"
                                    min="0"
                                    max="59"
                                    placeholder="45"
                                    class="sport-input w-full px-4 py-3 rounded-lg text-white placeholder-cyan-500"
                                    value="0"
                                />
                            </div>
                        </div>

                        <button
                            onclick="addEvent()"
                            class="sport-btn gradient-epic w-full mt-8 text-white font-black py-4 px-4 rounded-lg flex items-center justify-center gap-2 text-lg"
                        >
                            <span>⚡</span>
                            <span>LAUNCH EVENT</span>
                            <span>⚡</span>
                        </button>
                    </div>

                    <!-- Summary Section -->
                    <div class="mt-10">
                        <div class="scoreboard">
                            <p class="stat-label">📊 Total Events</p>
                            <p id="totalEvents" class="stat-value">0</p>
                        </div>
                        <div class="scoreboard">
                            <p class="stat-label">⏱️ Total Duration</p>
                            <p id="totalDuration" class="stat-value">0h 0m</p>
                        </div>
                        <div class="scoreboard">
                            <p class="stat-label">🏁 Finish Time</p>
                            <p id="endTime" class="stat-value text-orange-400">--:--</p>
                        </div>
                    </div>

                    <!-- Action Buttons -->
                    <div class="mt-8 space-y-3">
                        <button
                            onclick="saveSchedule()"
                            id="saveBtn"
                            class="sport-btn gradient-success w-full text-black font-black py-3 px-4 rounded-lg flex items-center justify-center gap-2 uppercase"
                        >
                            <span>💾</span>
                            <span>Save Schedule</span>
                        </button>
                        <button
                            onclick="exportCSV()"
                            id="exportBtn"
                            class="sport-btn gradient-warning w-full text-black font-black py-3 px-4 rounded-lg flex items-center justify-center gap-2 uppercase"
                        >
                            <span>📥</span>
                            <span>Export to CSV</span>
                        </button>
                        <button
                            onclick="clearSchedule()"
                            class="sport-btn gradient-danger w-full text-white font-black py-3 px-4 rounded-lg flex items-center justify-center gap-2 uppercase"
                        >
                            <span>🗑️</span>
                            <span>Clear All</span>
                        </button>
                    </div>

                    <!-- Notification -->
                    <div id="notification" class="hidden mt-6 p-4 rounded-lg text-center font-bold text-lg uppercase tracking-wide"></div>
                </div>
            </div>

            <!-- Right Panel: Schedule Table -->
            <div class="lg:col-span-3">
                <div class="sport-card rounded-xl border-4 border-lime-400 overflow-hidden">
                    <div class="bg-gradient-to-r from-cyan-600 to-blue-600 px-6 py-4">
                        <h3 class="text-2xl font-black text-white">🏁 RACE SCHEDULE</h3>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="w-full">
                            <thead>
                                <tr class="bg-gradient-to-r from-cyan-900 to-blue-900 border-b-4 border-lime-400">
                                    <th class="px-4 py-4 text-left text-xs font-black uppercase text-lime-300">#</th>
                                    <th class="px-4 py-4 text-left text-xs font-black uppercase text-lime-300">🏃 Event</th>
                                    <th class="px-4 py-4 text-center text-xs font-black uppercase text-lime-300">🏁 Start</th>
                                    <th class="px-4 py-4 text-center text-xs font-black uppercase text-lime-300">✓ End</th>
                                    <th class="px-4 py-4 text-center text-xs font-black uppercase text-lime-300">⏱️ Duration</th>
                                    <th class="px-4 py-4 text-center text-xs font-black uppercase text-lime-300">👥 Athletes</th>
                                    <th class="px-4 py-4 text-center text-xs font-black uppercase text-lime-300">⏰ Time</th>
                                    <th class="px-4 py-4 text-center text-xs font-black uppercase text-lime-300">⚙️ Control</th>
                                </tr>
                            </thead>
                            <tbody id="eventsTable">
                                <tr class="border-t-2 border-cyan-500">
                                    <td colspan="8" class="px-4 py-12 text-center text-cyan-400">
                                        <p class="text-2xl font-black mb-2">🚀 READY TO RACE?</p>
                                        <p class="text-sm uppercase tracking-wider">Launch your first event to get started</p>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Global state
        let events = [];

        // Initialize on page load
        document.addEventListener('DOMContentLoaded', () => {
            loadSchedule();
            setupEventListeners();
        });

        // Setup event listeners for form inputs
        function setupEventListeners() {
            document.getElementById('eventName').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') addEvent();
            });
        }

        // Load schedule from backend
        async function loadSchedule() {
            try {
                const response = await fetch('/api/schedule');
                const result = await response.json();

                if (result.success && result.data && result.data.events && Array.isArray(result.data.events)) {
                    events = result.data.events.map(evt => ({
                        ...evt,
                        id: evt.id || generateId()
                    }));
                    updateTable();
                    updateLastSaved();
                }
            } catch (error) {
                console.error('Error loading schedule:', error);
            }
        }

        // Generate unique ID
        function generateId() {
            return `evt-${Date.now()}-${Math.random().toString(36).substr(2, 9)}`;
        }

        // Add event to schedule
        function addEvent() {
            const name = document.getElementById('eventName').value.trim();
            const startTime = document.getElementById('startTime').value;
            const competitorCount = parseInt(document.getElementById('competitorCount').value) || 0;
            const avgTimeSec = parseInt(document.getElementById('avgTimeSec').value) || 0;

            if (!name || competitorCount < 1) {
                showNotification('⚠️ Fill all fields! Athletes must be ≥ 1', 'error');
                return;
            }

            const newEvent = {
                id: generateId(),
                name,
                startTime,
                competitorCount,
                avgTimeMinutes: 0,
                avgTimeSeconds: avgTimeSec,
                durationInSeconds: competitorCount * avgTimeSec,
                endTime: addSecondsToTime(startTime, competitorCount * avgTimeSec)
            };

            events.push(newEvent);

            // Clear form
            document.getElementById('eventName').value = '';
            document.getElementById('startTime').value = '09:00';
            document.getElementById('competitorCount').value = '1';
            document.getElementById('avgTimeSec').value = '0';

            cascadeCalculation();
            showNotification('🚀 Event Launched! Full speed ahead!', 'success');
        }

        // Cascade recalculation logic
        function cascadeCalculation() {
            let currentTime = events.length > 0 ? timeToSeconds(events[0].startTime) : 0;

            events.forEach((event, index) => {
                if (index === 0) {
                    event.startTime = secondsToTime(currentTime);
                } else {
                    event.startTime = secondsToTime(currentTime);
                }

                const duration = event.competitorCount * (event.avgTimeMinutes * 60 + event.avgTimeSeconds);
                event.durationInSeconds = duration;
                event.endTime = secondsToTime(currentTime + duration);

                currentTime += duration;
            });

            updateTable();
        }

        // Convert time string (HH:MM) to seconds
        function timeToSeconds(timeStr) {
            const [hours, minutes] = timeStr.split(':').map(Number);
            return hours * 3600 + minutes * 60;
        }

        // Convert seconds to time string (HH:MM)
        function secondsToTime(seconds) {
            const hours = Math.floor(seconds / 3600) % 24;
            const minutes = Math.floor((seconds % 3600) / 60);
            return `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}`;
        }

        // Add seconds to a time string
        function addSecondsToTime(timeStr, secondsToAdd) {
            const baseSeconds = timeToSeconds(timeStr);
            return secondsToTime(baseSeconds + secondsToAdd);
        }

        // Format seconds to readable duration
        function formatDuration(seconds) {
            const hours = Math.floor(seconds / 3600);
            const minutes = Math.floor((seconds % 3600) / 60);
            if (hours > 0) {
                return `${hours}h ${minutes}m`;
            }
            return `${minutes}m`;
        }

        // Update table display
        function updateTable() {
            const tbody = document.getElementById('eventsTable');

            if (events.length === 0) {
                tbody.innerHTML = `
                    <tr class="border-t-2 border-cyan-500">
                        <td colspan="8" class="px-4 py-12 text-center text-cyan-400">
                            <p class="text-2xl font-black mb-2">🚀 READY TO RACE?</p>
                            <p class="text-sm uppercase tracking-wider">Launch your first event to get started</p>
                        </td>
                    </tr>
                `;
                updateSummary();
                return;
            }

            tbody.innerHTML = events.map((event, index) => `
                <tr class="border-t-2 border-cyan-500">
                    <td class="px-4 py-4 text-sm font-black text-lime-300">${index + 1}</td>
                    <td class="px-4 py-4 text-sm font-bold text-white">${event.name}</td>
                    <td class="px-4 py-4 text-center text-sm">
                        <input
                            type="time"
                            value="${event.startTime}"
                            onchange="updateEventTime(${index}, this.value)"
                            class="sport-input rounded px-2 py-1 text-xs w-full focus:outline-none"
                        />
                    </td>
                    <td class="px-4 py-4 text-center text-sm font-black text-lime-400">${event.endTime}</td>
                    <td class="px-4 py-4 text-center text-sm font-bold text-cyan-300">${formatDuration(event.durationInSeconds)}</td>
                    <td class="px-4 py-4 text-center text-sm">
                        <input
                            type="number"
                            value="${event.competitorCount}"
                            min="1"
                            onchange="updateEventCompetitors(${index}, this.value)"
                            class="sport-input rounded px-2 py-1 text-xs w-16 focus:outline-none"
                        />
                    </td>
                    <td class="px-4 py-4 text-center text-sm">
                        <input
                            type="number"
                            value="${event.avgTimeSeconds}"
                            min="0"
                            max="59"
                            onchange="updateEventAvgTime(${index}, this.value)"
                            class="sport-input rounded px-2 py-1 text-xs w-16 focus:outline-none"
                        />s
                    </td>
                    <td class="px-4 py-4 text-center text-sm">
                        <button
                            onclick="deleteEvent(${index})"
                            class="bg-red-600 hover:bg-red-700 text-white px-3 py-1 rounded font-bold transition transform hover:scale-110"
                        >
                            ✕
                        </button>
                    </td>
                </tr>
            `).join('');

            updateSummary();
        }

        // Update event start time
        function updateEventTime(index, newTime) {
            events[index].startTime = newTime;
            cascadeCalculation();
        }

        // Update event competitor count
        function updateEventCompetitors(index, value) {
            events[index].competitorCount = Math.max(1, parseInt(value) || 1);
            cascadeCalculation();
        }

        // Update event average time
        function updateEventAvgTime(index, value) {
            events[index].avgTimeSeconds = Math.max(0, Math.min(59, parseInt(value) || 0));
            cascadeCalculation();
        }

        // Delete event
        function deleteEvent(index) {
            if (confirm(`Remove "${events[index].name}"?`)) {
                events.splice(index, 1);
                cascadeCalculation();
                showNotification('🗑️ Event Eliminated!', 'success');
            }
        }

        // Update summary metrics
        function updateSummary() {
            document.getElementById('totalEvents').textContent = events.length;

            if (events.length === 0) {
                document.getElementById('totalDuration').textContent = '0h 0m';
                document.getElementById('endTime').textContent = '--:--';
                return;
            }

            const lastEvent = events[events.length - 1];
            const totalSeconds = timeToSeconds(lastEvent.endTime) - timeToSeconds(events[0].startTime);

            document.getElementById('totalDuration').textContent = formatDuration(totalSeconds);
            document.getElementById('endTime').textContent = lastEvent.endTime;
        }

        // Save schedule to backend
        async function saveSchedule() {
            if (events.length === 0) {
                showNotification('⚠️ No events to save!', 'error');
                return;
            }

            const btn = document.getElementById('saveBtn');
            btn.disabled = true;
            btn.textContent = '💾 SYNCING...';

            try {
                const response = await fetch('/api/schedule', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        name: 'Competition Schedule',
                        events: events
                    })
                });

                const result = await response.json();

                if (result.success) {
                    showNotification('✅ SCHEDULE SAVED! CHAMPIONSHIP READY!', 'success');
                    updateLastSaved();
                } else {
                    showNotification('❌ Save failed', 'error');
                }
            } catch (error) {
                console.error('Error saving schedule:', error);
                showNotification('❌ Connection Error', 'error');
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<span>💾</span><span>SAVE SCHEDULE</span>';
            }
        }

        // Export schedule as CSV
        function exportCSV() {
            if (events.length === 0) {
                showNotification('⚠️ No events to export!', 'error');
                return;
            }

            const headers = ['#', 'Event', 'Start Time', 'End Time', 'Duration', 'Athletes', 'Time/Athlete (sec)'];
            const rows = events.map((event, index) => [
                index + 1,
                event.name,
                event.startTime,
                event.endTime,
                formatDuration(event.durationInSeconds),
                event.competitorCount,
                event.avgTimeSeconds
            ]);

            // Add summary row
            const lastEvent = events[events.length - 1];
            const totalSeconds = timeToSeconds(lastEvent.endTime) - timeToSeconds(events[0].startTime);
            rows.push(['', 'TOTAL RACE TIME', events[0].startTime, lastEvent.endTime, formatDuration(totalSeconds), '', '']);

            // Generate CSV content
            const csvContent = [
                headers.join(','),
                ...rows.map(row => row.map(cell => `"${cell}"`).join(','))
            ].join('\n');

            // Create download link
            const element = document.createElement('a');
            element.setAttribute('href', `data:text/csv;charset=utf-8,${encodeURIComponent(csvContent)}`);
            const timestamp = new Date().toISOString().slice(0, 10);
            element.setAttribute('download', `championship_schedule_${timestamp}.csv`);
            element.style.display = 'none';

            document.body.appendChild(element);
            element.click();
            document.body.removeChild(element);

            showNotification('📥 SCHEDULE EXPORTED! SHARE THE HEAT!', 'success');
        }

        // Clear schedule
        function clearSchedule() {
            if (confirm('🗑️ WIPE ALL EVENTS? This cannot be undone!')) {
                events = [];
                updateTable();
                showNotification('🗑️ SLATE CLEARED! Start Fresh!', 'success');
            }
        }

        // Show notification
        function showNotification(message, type = 'info') {
            const notification = document.getElementById('notification');
            notification.textContent = message;
            notification.className = `p-4 rounded-lg text-center font-bold`;

            if (type === 'success') {
                notification.style.background = 'linear-gradient(135deg, #00ff88 0%, #00cc66 100%)';
                notification.style.color = '#000';
            } else if (type === 'error') {
                notification.style.background = 'linear-gradient(135deg, #ff3333 0%, #cc0000 100%)';
                notification.style.color = '#fff';
            } else {
                notification.style.background = 'linear-gradient(135deg, #00d4ff 0%, #0099ff 100%)';
                notification.style.color = '#000';
            }

            notification.classList.remove('hidden');

            setTimeout(() => {
                notification.classList.add('hidden');
            }, 3500);
        }

        // Update last saved timestamp
        function updateLastSaved() {
            const now = new Date();
            const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            document.getElementById('lastSaved').textContent = timeStr;
        }
    </script>
</body>
</html>
